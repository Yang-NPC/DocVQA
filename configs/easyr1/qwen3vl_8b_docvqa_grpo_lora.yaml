data:
  train_files: data/docvqa_easyr1/train.jsonl
  val_files: data/docvqa_easyr1/val.jsonl
  prompt_key: prompt
  answer_key: answer
  image_key: images
  image_dir: data/docvqa_easyr1
  max_prompt_length: 2048
  max_response_length: 1024
  rollout_batch_size: 16
  mini_rollout_batch_size: null
  val_batch_size: 16
  format_prompt: null
  shuffle: true
  seed: 42
  min_pixels: null
  max_pixels: 1003520
  filter_overlong_prompts: true
  filter_overlong_prompts_workers: 8

algorithm:
  adv_estimator: grpo
  disable_kl: false
  use_kl_loss: true
  kl_penalty: low_var_kl
  kl_coef: 5.0e-2
  online_filtering: false
  filter_key: overall
  filter_low: 0.01
  filter_high: 0.99

worker:
  actor:
    global_batch_size: 8
    micro_batch_size_per_device_for_update: 4
    micro_batch_size_per_device_for_experience: 4
    max_grad_norm: 1.0
    padding_free: true
    dynamic_batching: true
    ulysses_size: 1
    model:
      model_path: Qwen/Qwen3-VL-8B-Thinking
      enable_gradient_checkpointing: true
      trust_remote_code: true
      freeze_vision_tower: false
      lora:
        rank: 32
        alpha: 64
        target_modules: q_proj,v_proj
        exclude_modules: .*visual.*
    optim:
      lr: 5.0e-6
      weight_decay: 1.0e-2
      strategy: adamw
      lr_warmup_ratio: 0.05
      lr_scheduler_type: cosine
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
      torch_dtype: bf16
      mp_param_dtype: bf16
      mp_reduce_dtype: fp32
      mp_buffer_dtype: fp32
    offload:
      offload_params: false
      offload_optimizer: false

  rollout:
    n: 4
    temperature: 1.0
    top_p: 1.0
    limit_images: 0
    gpu_memory_utilization: 0.7
    enforce_eager: false
    enable_chunked_prefill: false
    tensor_parallel_size: 1
    disable_tqdm: false
    val_override_config:
      temperature: 0.0
      top_p: 1.0
      n: 1

  ref:
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
      torch_dtype: bf16
      mp_param_dtype: bf16
      mp_reduce_dtype: fp32
      mp_buffer_dtype: fp32
    offload:
      offload_params: false

  reward:
    reward_function: rewards/easyr1_docvqa_reward.py:compute_score

trainer:
  total_epochs: 1
  max_steps: null
  project_name: docvqa_grpo
  experiment_name: qwen3vl_8b_docvqa_grpo_lora
  logger: ["file"]
  nnodes: 1
  n_gpus_per_node: 1
  max_try_make_batch: 20
  val_freq: 50
  val_before_train: true
  val_only: false
  val_generations_to_log: 3
  save_freq: 50
  save_limit: 3
  save_model_only: false
  save_checkpoint_path: checkpoints/docvqa_grpo
  load_checkpoint_path: null
  find_last_checkpoint: true
